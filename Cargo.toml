[package]
name = "discord-logging"
version = "0.1.0"
edition = "2024"

[dependencies]
serenity = {
    git = "https://github.com/serenity-rs/serenity.git",
    rev = "c84604143ccdf9ffa62d609ed191ab5900c8576d",
    default-features = false,
    features = [
        "gateway",
        "rustls_backend",
        "model",
        "cache",
        "temp_cache"
    ]
}
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
toml = "1.2.1"
serde = { version = "1", features = ["derive"] }
log = "0.4.35"
log4rs = "1"
sqlx = { version =  "0.9.0", features = ["runtime-tokio", "postgres", "uuid"] }
time = { version = "0.3.53", features = ["macros"]}
stringmetrics = "2.2.2"
similar = { version = "3.2.1", features = ["inline"] }
reqwest = "0.13.5"
serde_json = "1.0.154"
